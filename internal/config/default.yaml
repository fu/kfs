# kfs config — the defaults, compiled into kfs.
#
# kfs writes this file to ~/.config/kfs/config.yaml on the first start and
# then keeps it up to date (hidden sections and rows, last namespaces), so
# comments do not survive there. Edit it while kfs is not running.

# The file format. kfs upgrades older files and never overwrites a newer one.
version: 2

# The order of the sections, top to bottom (and in the menu). Sections not
# listed follow in this order.
resource_order:
  - gitops
  - deployments
  - replicasets
  - pods
  - services
  - ingressroutes
  - configmaps
  - claims
  - volumes
  - secrets

# Sections toggled off with their key (g e r p i u o m v s) stay off on the next start.
sections:
  hidden: []

# Rows in these states are not shown (toggle them in the filter pane, f).
#   pods:         running, pending, failing, completed
#   deployments:  ready, progressing, stuck, scaled-down
#   replicasets:  active, old (an earlier revision scaled to zero)
#   claims:       bound, pending, lost
#   volumes:      bound, available, released, failed
hide:
  pods: [completed]
  replicasets: [old]

# Where the divider sits between the sections and the change log, as the
# change log's share of the space in percent (5–95). kfs updates this on the
# fly when you press Q / A and restores it on the next start.
layout:
  changes_pct: 33

# The rail: a time line from the kfs badge down the left edge and along the
# divider to the right, showing the last `minutes`. The newest moment is at the
# top; everything walks towards the end as time passes. A slot is grey when
# something changed then (brighter the more), red when an alert came in (a
# warning event, or something turning red). It is re-cut to the window size.
rail:
  minutes: 10

# What each section on the page shows in its title, after its name; "*"
# adds to every section ("pods: []" leaves pods only the "*" items).
# Available:
#   every section:  errors (a watch that fails), hidden (rows hidden by state)
#   gitops:         light (the worst light of the apps and their parents)
#   deployments, replicasets, pods, services, ingressroutes, claims, volumes:
#                   lights ("8 ●5 ●2 ●1": how many, green, amber, red)
#   pods:           forwards (running port-forwards), metrics (when
#                   metrics-server cannot be reached)
#   secrets, configmaps: count
status:
  "*": [errors, hidden]
  gitops: [light]
  deployments: [lights]
  pods: [lights, forwards, metrics]
  services: [lights]
  ingressroutes: [lights]
  claims: [lights]
  configmaps: [count]
  secrets: [count]

# Commands the selected row offers, per section, and their keys (several:
# "l enter"). Commands not listed exist but are not offered; "*" is for every
# section ("pods: {}" offers no pod commands). Page keys (c n f, the section
# keys, Shift+<section key> to sort a section by its columns, q a Q A, j k,
# digits, esc) win over commands. Available:
#   every section:  describe (kubectl describe), yaml (kubectl get -o yaml,
#                   secret values masked), copy (the name to the clipboard)
#   pods:          logs, previous-logs (kubectl logs -p), shell, forward
#   secrets:        open (values masked until r reveals them)
commands:
  "*":
    describe: d
    copy: y
  pods:
    logs: l enter
    shell: h
    forward: w
  secrets:
    open: enter

# Colors as "#rrggbb" (quoted: # starts a YAML comment). An ANSI number
# ("0"-"255") works too and follows your terminal's theme instead.
colors:
  good: "#5faf5f"       # green: running, synced, healthy
  busy: "#ffaf00"       # amber: on its way (pending, rolling out)
  warn: "#d7d700"       # yellow: worth a look (restarts, high usage)
  bad: "#d75f5f"        # red: failing
  info: "#00afaf"       # cyan: accents, the kfs badge, the menus' keys
  flash: "#d7d700"      # background of a cell that just changed
  selected: "#3a3a3a"   # background of the selected row
  linked: "#005f5f"     # background of rows linked to the selected one
  menu: "#303030"       # background of the menus
