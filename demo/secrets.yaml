# Demo values only. kfs never shows them unless asked (open a secret, then r).
apiVersion: v1
kind: Secret
metadata:
  name: db-auth
  labels:
    app.kubernetes.io/name: db
type: Opaque
stringData:
  password: demo-only-not-a-secret
---
# Read by the web app through envFrom: links web's pod to it.
apiVersion: v1
kind: Secret
metadata:
  name: web-api
  labels:
    app.kubernetes.io/name: web
type: Opaque
stringData:
  API_KEY: demo-api-key
  API_URL: https://api.example.org
