# The Deployment: one pod (so one ReplicaSet per rollout) with two containers,
# the app and a sidecar that polls it and logs a line every few seconds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: shop-web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # short, so a broken rollout turns red ("stuck") within a minute
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: shop-web
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: web-env
            - secretRef:
                name: web-api
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: password
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /health.html
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health.html
              port: http
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 24Mi }
            limits: { cpu: 200m, memory: 64Mi }
        - name: sidecar
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                if wget -q -O /dev/null http://localhost/; then echo "$(date -Iseconds) web ok"
                else echo "$(date -Iseconds) web down"; fi
                sleep 3
              done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
      volumes:
        - name: html
          configMap:
            name: web-html
