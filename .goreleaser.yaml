# Release config: https://goreleaser.com — run by .github/workflows/release.yml
# on every vX.Y.Z tag.
version: 2

project_name: kfs

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: kfs
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/fu/kfs/cmd.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

# Homebrew: writes Casks/kfs.rb to github.com/fu/homebrew-tap, so that
#   brew install fu/tap/kfs
# works. Needs the repo secret HOMEBREW_TAP_GITHUB_TOKEN (a token that can
# push to fu/homebrew-tap); without it this step is skipped.
homebrew_casks:
  - name: kfs
    repository:
      owner: fu
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/fu/kfs
    description: "One namespace, everything in it, live: kubectl get -w on steroids"
    commit_author:
      name: Christian Fufezan
      email: christian@fufezan.net
    # The binaries are not notarized; let macOS run them anyway.
    # hooks.post.install would emit the deprecated `postflight` stanza;
    # hooks.post.install_steps (emitting `postflight_steps`) lands in v2.19.
    # Until then, write the block by hand. The {{ "{{staged_path}}" }}
    # escaping keeps GoReleaser's template engine from consuming Homebrew's
    # {{staged_path}} interpolation.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/kfs"]
        end
      end
